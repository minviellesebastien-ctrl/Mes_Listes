<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Listes</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mes Listes</h1>
    </header>

    <div class="main-container">
        <div class="list-item add-card">
            <div class="list-content" style="flex-direction: column; align-items: stretch; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </span>
                    <span class="list-title" style="font-weight: 600; color: var(--primary-green);">Ajouter une liste</span>
                </div>
                <div class="add-inline-row">
                    <input type="text" id="newDiverseInput" placeholder="Nom de la nouvelle liste..." onkeypress="handleKeyAdd(event)">
                    <button onclick="addDiverseList()">Ajouter</button>
                </div>
            </div>
        </div>

        <div id="fixed-lists">
            <div class="list-item" onclick="openModal('Repas')">
                <div class="list-content">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/><path d="M6 8l-2 2M18 8l2 2"/></svg>
                    </span>
                    <span class="list-title">Repas</span>
                </div>
                <span class="arrow">&gt;</span>
            </div>

            <div class="list-item" onclick="openModal('Cadeaux')">
                <div class="list-content">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                    </span>
                    <span class="list-title">Cadeaux</span>
                </div>
                <span class="arrow">&gt;</span>
            </div>

            <div class="list-item" onclick="openModal('Idées')">
                <div class="list-content">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18h6M10 22h4M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14z"/></svg>
                    </span>
                    <span class="list-title">Idées</span>
                </div>
                <span class="arrow">&gt;</span>
            </div>

            <div class="list-item" onclick="openModal('Courses')">
                <div class="list-content">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    </span>
                    <span class="list-title">Courses</span>
                </div>
                <span class="arrow">&gt;</span>
            </div>

            <div class="list-item" onclick="openModal('A faire')">
                <div class="list-content">
                    <span class="list-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/></svg>
                    </span>
                    <span class="list-title">A faire</span>
                </div>
                <span class="arrow">&gt;</span>
            </div>
        </div>

        <div class="separator"></div>

        <div class="scrollable-section" id="diverse-lists-container">
            </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn btn-importer" onclick="triggerImport()">
            Importer
        </button>
        <button class="nav-btn btn-exporter" onclick="triggerExport()">
            Exporter
        </button>
    </div>

    <div id="customModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">Fermer ×</button>
            <h2 class="modal-title" id="modalTitle">Titre</h2>
            <div class="modal-body">
                <div class="modal-input-row">
                    <input type="text" id="newItemInput" placeholder="Ajouter un élément..." onkeypress="handleItemKeyPress(event)">
                    <button onclick="addItemToList()">Ajouter</button>
                </div>
                <ul id="itemListContainer" class="item-list-container">
                    </ul>
            </div>
        </div>
    </div>

    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">

    <script src="script.js"></script>
</body>
                      </html>
