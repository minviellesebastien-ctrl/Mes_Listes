<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Listes</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper" id="pageWrapper">
        <header>
            <div class="header-banner">
                <svg class="header-toque" viewBox="0 0 24 24" width="34" height="34" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 13.87A4 4 0 0 1 7.41 6a5 5 0 0 1 9.18 0A4 4 0 0 1 18 13.87V21H6z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
                <h1>Mes Listes</h1>
            </div>
        </header>

        <div class="main-container">
            <!-- Cadre des listes fixes -->
            <div class="fixed-lists-section">
                <div class="list-item" onclick="openModal('Mes Repas')">
                    <div class="list-content">
                        <span class="list-icon">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                        </span>
                        <span class="list-title">Mes Repas</span>
                    </div>
                    <span class="arrow-icon">&gt;</span>
                </div>

                <div class="list-item" onclick="openModal('Liste Cadeaux')">
                    <div class="list-content">
                        <span class="list-icon">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                        </span>
                        <span class="list-title">Liste Cadeaux</span>
                    </div>
                    <span class="arrow-icon">&gt;</span>
                </div>

                <div class="list-item" onclick="openModal('Liste Idées')">
                    <div class="list-content">
                        <span class="list-icon">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18h6M10 22h4M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14z"/></svg>
                        </span>
                        <span class="list-title">Liste Idées</span>
                    </div>
                    <span class="arrow-icon">&gt;</span>
                </div>

                <div class="list-item" onclick="openModal('Liste Courses')">
                    <div class="list-content">
                        <span class="list-icon">
                            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        </span>
                        <span class="list-title">Liste Courses</span>
                    </div>
                    <span class="arrow-icon">&gt;</span>
                </div>
            </div>

            <!-- Trait vert -->
            <div class="green-divider"></div>

            <!-- Nouveau cadre scrollable destiné aux nouvelles listes -->
            <div class="scrollable-diverse-section">
                <div id="diverse-lists-container"></div>
            </div>

            <!-- Cadre jaune en bas, sans le '+' -->
            <div class="bottom-input-card">
                <input type="text" id="newDiverseInput" placeholder="Ajouter une liste..." onkeypress="handleKeyAdd(event)">
                <button class="action-btn-ajouter" onclick="addDiverseList()">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Barre du bas : Importer / Exporter -->
    <div class="bottom-nav">
        <button class="nav-btn btn-importer" onclick="triggerImport()">
            Importer
        </button>
        <button class="nav-btn btn-exporter" onclick="triggerExport()">
            Exporter
        </button>
    </div>

    <!-- Pop-up avec contour vert -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">Fermer ×</button>
            <h2 class="modal-title" id="modalTitle">Titre</h2>
            <div class="modal-body">
                <div class="modal-input-row">
                    <input type="text" id="newItemInput" placeholder="Ajouter un élément..." onkeypress="handleItemKeyPress(event)">
                    <button class="circle-add-btn" onclick="addItemToList()" title="Ajouter">+</button>
                </div>
                <ul id="itemListContainer" class="item-list-container">
                    <!-- Éléments internes -->
                </ul>
            </div>
        </div>
    </div>

    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">

    <script src="script.js"></script>
</body>
              </html>
